<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local RAG - 知识库问答系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
                    <span class="logo-text">Local RAG</span>
                </div>
            </div>

            <!-- 历史对话列表 -->
            <div class="sidebar-conversations" id="sidebarConversations">
                <div class="conversation-header">
                    <span>历史对话</span>
                    <button class="new-conversation-btn" id="newConversationBtn" title="开启新对话">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    </button>
                </div>
                <div class="conversation-list" id="sidebarConversationList">
                    <div class="conversation-empty">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
                        <span>暂无对话记录</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-tab="chat">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
                    <span>智能问答</span>
                </a>
                <a href="#" class="nav-item" data-tab="knowledge">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
                    <span>知识库</span>
                </a>

            </nav>

            <div class="sidebar-footer">
                <a href="#" class="nav-item" data-tab="settings">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span>系统设置</span>
                </a>
                <!-- <button class="sidebar-toggle" id="sidebarToggle" title="展开/收起侧边栏">
                    <span class="toggle-arrow"></span>
                </button> -->
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 智能问答页面 -->
            <div class="tab-content active" id="tab-chat">
                <!-- 顶部栏 -->
                <header class="content-header">
                    <h1>智能问答</h1>
                    <p class="subtitle">基于 RAG 的本地知识库问答系统</p>
                </header>



                <!-- 居中对话区域 -->
                <div class="chat-wrapper">
                    <!-- 聊天消息区域 -->
                    <div class="chat-messages" id="chatMessages">
                        <div id="conversationContainer"></div>
                        <div class="welcome-message" id="welcomeMessage">
                            <div class="welcome-icon">
                                <i data-lucide="sparkles"></i>
                            </div>
                            <h2>欢迎使用智能问答</h2>
                            <p>上传文档到知识库后，我可以根据文档内容回答你的问题</p>
                        </div>
                    </div>

                    <!-- 检索结果按钮 -->
                    <button class="chunks-toggle-btn" id="chunksToggleBtn" style="display: none;">
                        <i data-lucide="file-text"></i>
                        <span>查看检索结果</span>
                        <span class="chunks-count" id="chunksCount"></span>
                    </button>

                    <!-- 固定底部输入区域 -->
                    <div class="chat-input-area">
                        <!-- 流程指示器 -->
                <div class="qa-flow" id="qaFlow" style="display: none;">
                    <div class="qa-step" id="qaStep0">
                        <span class="step-num">1</span>
                        <span class="step-text">意图识别</span>
                    </div>
                    <div class="qa-step" id="qaStep1">
                        <span class="step-num">2</span>
                        <span class="step-text">向量化</span>
                    </div>
                    <div class="qa-step" id="qaStep2">
                        <span class="step-num">3</span>
                        <span class="step-text">知识库检索</span>
                    </div>
                    <div class="qa-step" id="qaStep3">
                        <span class="step-num">4</span>
                        <span class="step-text">本地Rerank</span>
                    </div>
                    <div class="qa-step" id="qaStep4">
                        <span class="step-num">5</span>
                        <span class="step-text">上下文构建</span>
                    </div>
                    <div class="qa-step" id="qaStep5">
                        <span class="step-num">6</span>
                        <span class="step-text">LLM 生成</span>
                    </div>
                </div>
                        <div class="chat-input-wrapper">
                            <textarea id="questionInput" placeholder="输入问题，按 Enter 发送..." rows="1"></textarea>
                            <button class="send-btn" id="askBtn">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 检索结果侧边栏 -->
                <div class="chunks-sidebar" id="chunksSidebar">
                    <div class="chunks-sidebar-header">
                        <h3><i data-lucide="file-text"></i> 检索到的相关分段</h3>
                        <button class="chunks-sidebar-close" id="chunksSidebarClose">
                            <i data-lucide="x"></i>
                        </button>
                    </div>
                    <div class="chunks-list" id="chunksList"></div>
                </div>
                <div class="chunks-sidebar-overlay" id="chunksSidebarOverlay"></div>
            </div>

            <!-- 知识库页面 -->
            <div class="tab-content" id="tab-knowledge">
                <header class="content-header">
                    <h1>知识库管理</h1>
                    <p class="subtitle">管理文档和知识库内容</p>
                </header>

                <div class="kb-layout">
                    <!-- 左侧：上传和统计 -->
                    <div class="kb-sidebar">
                        <!-- 上传卡片 -->
                        <div class="card">
                            <h3><i data-lucide="upload"></i> 上传文档</h3>
                            <div class="upload-area" id="uploadArea">
                                <i data-lucide="file-up" class="upload-icon"></i>
                                <p>拖拽文件到此处</p>
                                <p class="upload-hint">支持 .md 和 .txt</p>
                                <input type="file" id="fileInput" accept=".md,.txt" hidden>
                            </div>

                            <!-- 分段配置 -->
                            <div class="config-section">
                                <h4>分段配置</h4>
                                <div class="config-row">
                                    <label for="chunkSize">分段大小</label>
                                    <input type="number" id="chunkSize" value="0" min="0" step="100">
                                </div>
                                <div class="config-row">
                                    <label for="chunkOverlap">分段重叠</label>
                                    <input type="number" id="chunkOverlap" value="0" min="0" max="500" step="10">
                                </div>
                            </div>

                            <button class="btn btn-primary" id="uploadBtn" disabled>
                                <i data-lucide="database"></i>
                                开始上传并构建知识库
                            </button>
                        </div>

                        <!-- 统计卡片 -->
                        <div class="card stats-card">
                            <h3><i data-lucide="bar-chart-3"></i> 统计信息</h3>
                            <div class="stats-grid">
                                <div class="stat-item">
                                    <span class="stat-value" id="totalEntities">-</span>
                                    <span class="stat-label">总分段数</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-value" id="docCount">-</span>
                                    <span class="stat-label">文档数</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 右侧：知识库内容 -->
                    <div class="kb-main">
                        <div class="card">
                            <div class="card-header">
                                <h3><i data-lucide="library"></i> 知识库内容</h3>
                                <div class="header-actions">
                                    <select id="docFilter" class="select">
                                        <option value="">所有文档</option>
                                    </select>
                                    <button class="btn btn-ghost btn-sm" id="refreshKbBtn">
                                        <i data-lucide="refresh-cw"></i>
                                    </button>
                                    <button class="btn btn-danger btn-sm" id="clearKbBtn">
                                        <i data-lucide="trash-2"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- 内容区域 -->
                            <div class="kb-content-wrapper">
                                <!-- 上传进度 -->
                                <div class="upload-progress" id="uploadProgress" style="display: none;">
                                    <div class="progress-header">
                                        <span id="progressFilename"></span>
                                        <span id="progressStatus" class="badge"></span>
                                    </div>
                                    <div class="progress-steps" id="progressSteps"></div>
                                </div>

                                <div class="kb-content" id="kbContent">
                                    <div class="kb-empty">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>
                                        <p>知识库为空，请先上传文档</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 系统设置页面 -->
            <div class="tab-content" id="tab-settings">
                <header class="content-header">
                    <h1>系统设置</h1>
                    <p class="subtitle">查看系统配置和状态</p>
                </header>

                <!-- 系统状态卡片 -->
                <div class="card">
                    <h3><i data-lucide="activity"></i> 系统状态</h3>
                    <div class="status-grid" id="statusGrid">
                        <div class="status-item loading">
                            <span class="status-label">加载中...</span>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        // 初始化 Lucide 图标
        lucide.createIcons();
    </script>
</body>
</html>
